name: Build Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: '6.8.3'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Assemble package
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0,7))" }
          $dist = "dist/NanoGo"
          New-Item -ItemType Directory -Force $dist, "$dist/models", "$dist/licenses" | Out-Null
          Copy-Item build/NanoGo.exe $dist
          # 纯 Widgets 程序，不需要软件 OpenGL、D3D/DXC 编译器和 OpenSSL 后端（网络用 Windows 自带的 Schannel）
          windeployqt --release --no-compiler-runtime --no-opengl-sw --no-system-d3d-compiler --no-system-dxc-compiler "$dist/NanoGo.exe"
          Remove-Item -Force -ErrorAction SilentlyContinue "$dist/tls/qopensslbackend.dll", "$dist/opengl32sw.dll", "$dist/dxcompiler.dll", "$dist/dxil.dll", "$dist/D3Dcompiler_47.dll"
          # 微软 VC 运行库（可再分发）放在程序旁边，用户不用另外安装
          Get-ChildItem "$env:VCToolsRedistDir\x64\Microsoft.VC*.CRT\*.dll" | Copy-Item -Destination $dist
          # KataGo 引擎和模型都不放进安装包：NanoGo 第一次打开时按本机硬件自动从官方下载
          # 授权文件
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md $dist
          Copy-Item packaging/README_使用说明.txt $dist
          Invoke-WebRequest "https://www.gnu.org/licenses/lgpl-3.0.txt" -OutFile "$dist/licenses/Qt-LGPL-3.0.txt"
          Invoke-WebRequest "https://www.gnu.org/licenses/gpl-3.0.txt" -OutFile "$dist/licenses/GPL-3.0.txt"
          # KataGo 不打包，但注明并附上它的许可证，方便用户了解
          Invoke-WebRequest "https://raw.githubusercontent.com/lightvector/KataGo/v1.18.1/LICENSE" -OutFile "$dist/licenses/KataGo-LICENSE.txt"
          # 打包结果自检：不能带 KataGo
          if (Test-Path "$dist/katago") { throw "package must not contain katago/" }
          "models are downloaded automatically on first run. 模型会在第一次打开时自动下载。" | Out-File "$dist/models/README.txt" -Encoding utf8
          Remove-Item -Recurse -Force "$dist/data", "$dist/nanogo.ini" -ErrorAction SilentlyContinue
          Compress-Archive -Path $dist -DestinationPath "NanoGo-$ver-windows-x64.zip"
          "ZIP=NanoGo-$ver-windows-x64.zip" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: NanoGo-windows-x64
          path: ${{ env.ZIP }}

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
